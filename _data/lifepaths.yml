"1":
  name: The Leader
  keywords: Independent, driven, original
  matches: 3, 5, 6
  overview: "Life Path 1 is the pioneer: self-motivated, decisive and happiest when building something of their own."
  example: "19 October 1988 gives month 10 → 1, day 19 → 10 → 1 and year 1+9+8+8 = 26 → 8; 1 + 1 + 8 = 10 → 1."
  strengths: ["Initiative — starts before others feel ready", "Clear vision and strong will", "Comfort with responsibility and decision-making"]
  challenges: ["Impatience with slower collaborators", "Difficulty asking for help", "Stubbornness when challenged"]
  career: "Entrepreneurship, leadership roles, product management, independent consulting and any field that rewards original thinking. Ones thrive with ownership and wilt under micromanagement."
  love: "Ones need a partner who respects their independence and has their own ambitions. Respect and admiration matter as much as romance."
  money: "Confident earners and decisive investors; the risk is over-concentration in their own ventures without a safety net."
  advice: "Lead, but build a team. Your ideas scale faster when other people can carry them."
