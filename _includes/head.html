<!doctype html>
<html lang="en" data-base="{{ site.baseurl }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == '/' %}{{ site.brand }}{% else %}{{ page.title }} | 193333{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
<meta property="og:type" content="{% if page.collection == 'guides' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="193333">
<meta property="og:title" content="{{ page.title | default: site.brand | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0a0c16">
<meta name="google-adsense-account" content="{{ site.adsense_client }}">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6620975821265271" crossorigin="anonymous"></script>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
/* Optional manual AdSense units: paste slot IDs from AdSense > Ads > By ad unit. Auto ads work without these. */
window.ADSENSE_SLOTS={top:"",mid:"",bottom:""};</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"193333","alternateName":"193333 Number Intelligence Hub","url":"{{ '/' | absolute_url }}","potentialAction":{"@type":"SearchAction","target":"{{ '/search/' | absolute_url }}?q={query}","query-input":"required name=query"}}</script>
{% if page.faq %}<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{% for f in page.faq %}{"@type":"Question","name":{{ f.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ f.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>{% endif %}
</head>
