# 193333.com — Number Intelligence Hub (Jekyll on GitHub Pages, free plan)
title: "193333"
brand: "193333 — Number Intelligence Hub"
description: "Angel number meanings, numerology calculators, number facts and business calculators — free, fast and explained step by step."
# While served from github.io keep these two lines. After pointing DNS at GitHub Pages
# and adding the custom domain, change url to https://193333.com and baseurl to "".
url: "https://webworksa1.github.io"
baseurl: "/193333-com"
lang: en
timezone: UTC
adsense_client: "ca-pub-6620975821265271"
plugins:
  - jekyll-sitemap
collections:
  angels:
    output: true
    permalink: /angel-numbers/:name/
  lifepaths:
    output: true
    permalink: /numerology/:name/
  guides:
    output: true
    permalink: /guides/:name/
defaults:
  - scope: { path: "", type: angels }
    values: { layout: angel }
  - scope: { path: "", type: lifepaths }
    values: { layout: lifepath }
  - scope: { path: "", type: guides }
    values: { layout: guide }
  - scope: { path: "" }
    values: { layout: page }
exclude:
  - README.md
  - PROMPTS.md
  - RESEARCH.md
  - DEPLOY.md
  - LICENSE
